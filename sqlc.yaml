version: "2"
cloud:
  organization: "Шмирко К.А."
  project: "GopherMart"
  hostname: ""
servers: []
sql:
  - schema: "internal/database/db/migrations"
    queries: "internal/database/db/queries/"
    engine: "postgresql"
    gen:
      go:
        package: "db"
        sql_package: "database/sql"
        out: "internal/database/db/postgres"
        emit_db_tags: true
        emit_json_tags: true
        #emit_prepared_queries: true
        #emit_sql_as_comment: true
overrides:
  go: null
plugins: []
rules: []
options: {}
